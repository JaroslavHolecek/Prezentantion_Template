<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Sloupcový graf: počet studentů na přednáškách v týdnech 1 až 5">
  <rect width="640" height="480" rx="20" fill="#f4f6f9"/>
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" fill="#5b6474">
    <path d="M80 60 V400 H600" fill="none" stroke="#9aa3b2" stroke-width="2"/>
    <path d="M80 315 H600 M80 230 H600 M80 145 H600" stroke="#dde2ea" stroke-width="1.5"/>
    <text x="68" y="406" text-anchor="end">0</text>
    <text x="68" y="321" text-anchor="end">25</text>
    <text x="68" y="236" text-anchor="end">50</text>
