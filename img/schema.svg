    <path d="M601 205 H672" stroke="#5b6474" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M795 290 C795 380, 165 380, 165 296" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
