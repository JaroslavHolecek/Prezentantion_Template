    <rect x="110" y="128" width="64" height="272" rx="4" fill="#16365c"/>
    <rect x="210" y="162" width="64" height="238" rx="4" fill="#16365c"/>
    <rect x="310" y="196" width="64" height="204" rx="4" fill="#16365c"/>
    <rect x="410" y="179" width="64" height="221" rx="4" fill="#16365c"/>
    <rect x="510" y="111" width="64" height="289" rx="4" fill="#1f6feb"/>

